<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Orçar obra rápido pela composição">
  <rect width="800" height="450" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#e3e3e8"/>
  <rect x="60" y="54" width="680" height="342" rx="14" fill="#f7f8fa" stroke="#e3e3e8"/>
  <text x="84" y="96" fill="#0071e3" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1.5">COMPOSIÇÃO → QUANTITATIVO → CUSTO</text>

  <rect x="84" y="122" width="200" height="230" rx="8" fill="#ffffff" stroke="#e3e3e8"/>
  <text x="104" y="150" fill="#6e6e73" font-family="Inter,Arial,sans-serif" font-size="12">Composição (1 m² alvenaria)</text>
  <g font-family="Inter,Arial,sans-serif" font-size="12.5" fill="#1d1d1f">
    <text x="104" y="182">Bloco cerâmico</text><text x="264" y="182" text-anchor="end" fill="#6e6e73">12,5 un</text>
    <text x="104" y="210">Argamassa</text><text x="264" y="210" text-anchor="end" fill="#6e6e73">0,012 m³</text>
    <text x="104" y="238">Cimento</text><text x="264" y="238" text-anchor="end" fill="#6e6e73">4,8 kg</text>
    <text x="104" y="266">Pedreiro</text><text x="264" y="266" text-anchor="end" fill="#6e6e73">0,45 h</text>
    <text x="104" y="294">Servente</text><text x="264" y="294" text-anchor="end" fill="#6e6e73">0,22 h</text>
    <text x="104" y="326" fill="#0071e3">Perda</text><text x="264" y="326" text-anchor="end" fill="#0071e3">5%</text>
  </g>

  <path d="M300 238 h56 m0 0 l-12 -8 m12 8 l-12 8" stroke="#0071e3" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="372" y="200" width="150" height="76" rx="8" fill="#ffffff" stroke="#e3e3e8"/>
  <text x="447" y="230" fill="#6e6e73" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">Quantitativo</text>
  <text x="447" y="256" fill="#1d1d1f" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">980 m²</text>
  <path d="M538 238 h56 m0 0 l-12 -8 m12 8 l-12 8" stroke="#0071e3" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <rect x="610" y="186" width="106" height="104" rx="8" fill="#ffffff" stroke="#e3e3e8"/>
  <text x="663" y="214" fill="#6e6e73" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">Custo</text>
  <text x="663" y="240" fill="#0071e3" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">R$ 63.210</text>
  <text x="663" y="266" fill="#86868b" font-family="Inter,Arial,sans-serif" font-size="11" text-anchor="middle">sem reescrever</text>
  <text x="663" y="280" fill="#86868b" font-family="Inter,Arial,sans-serif" font-size="11" text-anchor="middle">fórmula</text>
</svg>
